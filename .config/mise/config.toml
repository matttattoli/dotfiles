[bootstrap.repos]
"~/gitrepos/dotfiles" = { url = "git@github.com:matttattoli/dotfiles.git", ref = "main" }
"~/.tmux-plugins/tmux-resurrect" = { url = "https://github.com/tmux-plugins/tmux-resurrect", ref = "cff343cf9e81983d3da0c8562b01616f12e8d548" }
"~/.tmux-plugins/tmux-continuum" = { url = "https://github.com/tmux-plugins/tmux-continuum.git", ref = "0698e8f4b17d6454c71bf5212895ec055c578da0" }

[settings]
minimum_release_age = "7d"
dotfiles.root = "~/gitrepos/dotfiles"

[dotfiles]
"~/.config/alacritty/alacritty.toml" = "~/gitrepos/dotfiles/.config/alacritty/alacritty.toml"
"~/.config/mise/config.toml" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "symlink" }
"~/.config/zed/settings.json" = { mode = "symlink"}
"~/.var/app/dev.zed.Zed/config/zed/settings.json" = "~/gitrepos/dotfiles/.config/zed/settings.json"
"~/.gitconfig" = { mode = "symlink" }
"~/.tmux.conf" = "~/gitrepos/dotfiles/.tmux.conf"

[oci]
from = "fedora:44"

[tools]
"aqua:neovim" = "latest"
biome = "latest"
bun = "latest"
difftastic = "latest"
fzf = "latest"
gh = "latest"
helm = "4"
helm-diff = "latest"
lua-language-server = "latest"
node = "lts"
"npm:@earendil-works/pi-coding-agent" = "latest"
oxfmt = "latest"
oxlint = "latest"
